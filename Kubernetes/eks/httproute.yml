apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptimelabe-httproute
spec:
  parentRefs:
    - name: public
      sectionName: http
  # hostnames: ["uptimelabs.in"]
  rules:  
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: apache-svc
          port: 80
