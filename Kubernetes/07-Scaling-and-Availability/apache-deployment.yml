apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: apache
        image: httpd:latest
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: apache-svc
spec:
  selector:
    app: apache
  ports:
  - port: 80
    targetPort: 80


---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apache
  minReplicas: 1
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0      # turant scale up
      policies:
      - type: Percent
        value: 100                       # ek baar mein pods double tak
        periodSeconds: 15
      - type: Pods
        value: 4                         # ya 4 pods tak
        periodSeconds: 15
      selectPolicy: Max                  # dono mein se jo zyada ho
    scaleDown:
      stabilizationWindowSeconds: 300    # 5 min stable raho, tab ghatao
      policies:
      - type: Percent
        value: 10                        # har minute sirf 10% pods hatao
        periodSeconds: 60