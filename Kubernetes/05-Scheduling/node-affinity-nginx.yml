apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-node-affinity
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-deploy-node-affinity
  template:
    metadata:
      labels:
        app: nginx-deploy-node-affinity
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: disktype
                    operator: In
                    values:
                      - ssd
      containers:
        - name: nginx-deploy-node-affinity
          image: nginx:latest
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
