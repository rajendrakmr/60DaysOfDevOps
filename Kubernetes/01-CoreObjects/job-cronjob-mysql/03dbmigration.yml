apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-migrations
data:
  001_create_tables.sql: |
    CREATE TABLE IF NOT EXISTS customers (
      id INT AUTO_INCREMENT PRIMARY KEY,
      name VARCHAR(100) NOT NULL,
      email VARCHAR(150) NOT NULL UNIQUE,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS orders (
      id INT AUTO_INCREMENT PRIMARY KEY,
      customer_id INT NOT NULL,
      product VARCHAR(100) NOT NULL,
      amount DECIMAL(10,2) NOT NULL,
      ordered_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      FOREIGN KEY (customer_id) REFERENCES customers(id)
    );
  002_seed_demo_data.sql: |
    -- INSERT IGNORE + UNIQUE email = dobara chalane par duplicate nahi banega
    INSERT IGNORE INTO customers (name, email) VALUES
      ('Rajendra', 'rajendra@example.com'),
      ('Asha',     'asha@example.com'),
      ('Vikram',   'vikram@example.com');
    INSERT INTO orders (customer_id, product, amount)
    SELECT c.id, 'Laptop', 55000.00 FROM customers c
    WHERE c.email = 'rajendra@example.com'
      AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.product = 'Laptop');
    INSERT INTO orders (customer_id, product, amount)
    SELECT c.id, 'Phone', 20000.00 FROM customers c
    WHERE c.email = 'asha@example.com'
      AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.product = 'Phone'); 
