metadata:
  name: pi1
spec:
  template:
    metadata: {}
    spec:
      containers:
      - command:
        - perl
        - -Mbignum=bpi
        - -wle
        - print bpi(2000)
        image: perl
        name: pi1
        resources: {}
      restartPolicy: Never
status: {}
