apiVersion: v1
kind: Pod
metadata:
  name: multicontainer
  labels:
    app: nginx
spec:
  volumes:
  - name: logs
    emptyDir: {}
  initContainers:
  - name: wait-for-svc
    image: busybox:latest
    command: ["sh", "-c", "echo myservice"]
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "100m"
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx
  - name: sidecar-logs
    image: busybox:latest
    command: ["sh", "-c", "tail -F /var/log/nginx/access.log"]
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "100m"
    volumeMounts:
    - name: logs
      mountPath: /var/log/nginx